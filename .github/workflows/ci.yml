name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash
    working-directory: BACKEND

jobs:
  build-check:
    name: Build and check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: BACKEND/package-lock.json

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev fd-find ripgrep
          sudo ln -s "$(command -v fdfind)" /usr/local/bin/fd

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check
        run: npm run check

  test:
    name: Test (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: agent-core
            package: packages/agent
            command: npm test
            install_uv: false
          - name: ai
            package: packages/ai
            command: npm test
            install_uv: false
          - name: tui
            package: packages/tui
            command: npm test
            install_uv: false
          - name: coding-agent 1/3
            package: packages/coding-agent
            command: npm run test:ci -- --shard=1/3
            install_uv: true
          - name: coding-agent 2/3
            package: packages/coding-agent
            command: npm run test:ci -- --shard=2/3
            install_uv: true
          - name: coding-agent 3/3
            package: packages/coding-agent
            command: npm run test:ci -- --shard=3/3
            install_uv: true
          - name: coding-agent process smoke
            package: packages/coding-agent
            command: npm run test:process
            install_uv: true
          - name: coding-agent kernel
            package: packages/coding-agent
            command: npm run test:kernel
            install_uv: true
          - name: runtime python
            package: prime-agent-runtime
            command: uv run --with "mcp>=2,<3" --with "httpx>=0.27,<1" python -m unittest discover -s test
            install_uv: true
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: BACKEND/package-lock.json

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev fd-find ripgrep
          sudo ln -s "$(command -v fdfind)" /usr/local/bin/fd

      - name: Install uv
        if: matrix.install_uv
        run: |
          python3 -m pip install --user uv
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        working-directory: BACKEND/${{ matrix.package }}
        run: ${{ matrix.command }}

  build-check-test:
    name: build-check-test
    if: always()
    needs: [build-check, test]
    runs-on: ubuntu-latest
    steps:
      - name: Verify CI results
        working-directory: .
        env:
          BUILD_CHECK_RESULT: ${{ needs.build-check.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          test "$BUILD_CHECK_RESULT" = success
          test "$TEST_RESULT" = success
