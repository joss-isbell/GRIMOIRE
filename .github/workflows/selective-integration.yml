name: Selective integration verification
on:
  push:
    branches: [vi/selective-v094-no-message-queue]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare immutable upstream and test dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/selective-integration
          git fetch https://github.com/PrimeIntellect-ai/prime-agent.git f771dfcedd684d1afff84ca2c6fa95c7a21efbc2
          git update-ref refs/heads/upstream-v094 FETCH_HEAD
          test "$(git rev-parse upstream-v094)" = f771dfcedd684d1afff84ca2c6fa95c7a21efbc2
          git log --format='%H %s' 9c8230df6..upstream-v094 | tee /tmp/selective-integration/upstream-history.txt
          git bundle create /tmp/selective-integration/upstream-v094.bundle upstream-v094 ^9c8230df6
          git worktree add --detach /tmp/upstream-v094 upstream-v094
          cd /tmp/upstream-v094
          npm ci
          tar -czf /tmp/selective-integration/node_modules.tar.gz node_modules
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selective-integration-dependencies
          path: /tmp/selective-integration
          retention-days: 3
          if-no-files-found: error
