name: Selective integration verification
on:
  push:
    branches: [vi/selective-v094-no-message-queue]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - name: Prepare pinned Python runtime for sandbox checks
        shell: bash
        env:
          UV_PYTHON_INSTALL_DIR: /tmp/grimoire-verification-python
        run: |
          set -euo pipefail
          git fetch https://github.com/PrimeIntellect-ai/prime-agent.git f771dfcedd684d1afff84ca2c6fa95c7a21efbc2
          git worktree add --detach /tmp/upstream-v094 FETCH_HEAD
          uv venv /tmp/grimoire-verification-kernel --python 3.11 --seed
          uv pip install --python /tmp/grimoire-verification-kernel/bin/python /tmp/upstream-v094/prime-agent-runtime dill requests httpx pyyaml tomli python-dotenv pandas numpy scipy beautifulsoup4 lxml pydantic tyro 'mcp>=2,<3'
          /tmp/grimoire-verification-kernel/bin/python -c 'import rlm.repl; assert rlm.repl.PROTOCOL_VERSION == 3; import dill, pandas, scipy, yaml'
          tar -C /tmp -czf /tmp/python-verification.tar.gz grimoire-verification-python grimoire-verification-kernel
      - uses: actions/upload-artifact@v4
        with:
          name: selective-python-runtime
          path: /tmp/python-verification.tar.gz
          retention-days: 3
          if-no-files-found: error
