name: Publish compatibility corrections
on:
  push:
    branches: [vi/selective-integration-tools-20260912]
    paths: [.github/workflows/selective-integration.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
      - name: Publish exact sandbox-verified corrections
        run: |
          set -euo pipefail
          git config user.name 'GRIMOIRE integration bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git worktree add -b vi/selective-v094-final-corrections /tmp/candidate 3f6bea170a55c0bb3158b89dc46cb8ddc702cf93
          cd /tmp/candidate
          git apply --index --unidiff-zero "$GITHUB_WORKSPACE/integration-kit/ci-compatibility.patch"
          git diff --cached --check
          test "$(git write-tree)" = b94b3439a4611f178e4ba5b086a04578f77b5813
          git commit -m 'fix(coding-agent): preserve encoding compatibility and isolate control-test assumptions'
          test -z "$(git status --porcelain)"
          test ! -d integration-kit
          test ! -e .github/workflows/selective-integration.yml
          git push origin HEAD:refs/heads/vi/selective-v094-final-corrections
          git show -s --format='%H %T %s'
