name: Queue investigation
on:
  push:
    branches: [fix/queue-notification-liveness]
    paths: [.github/workflows/queue-diagnostics.yml]
permissions:
  contents: read
jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Queue history and upstream comparison
        run: |
          git log --first-parent --format='%h %ad %s' --date=iso-strict -20 origin/main
          git log --follow --format='%h %ad %s' --date=iso-strict -20 -- BACKEND/packages/coding-agent/src/core/agent-session.ts
          git log --all --format='%h %ad %s' --date=iso-strict -G '_drainQueuedMessagesAfterBash|queueAgentMessagePrompt|_sessionInputPump' -- BACKEND/packages/coding-agent/src/core/agent-session.ts packages/coding-agent/src/core/agent-session.ts | head -45
          git fetch --no-tags --depth=1 https://github.com/PrimeIntellect-ai/prime-agent.git main
          git show -s --format='%H %ad %s' --date=iso-strict FETCH_HEAD
          git show FETCH_HEAD:packages/coding-agent/src/core/agent-session.ts > /tmp/upstream-agent-session.ts
          python3 - <<'PY'
          from pathlib import Path
          lines=Path('/tmp/upstream-agent-session.ts').read_text().splitlines()
          for symbol in ['async queueAgentMessagePrompt(', 'async executeBash(', 'async runUserBash(']:
              for i,line in enumerate(lines):
                  if symbol in line:
                      print('UPSTREAM',symbol,'line',i+1)
                      print('\n'.join(lines[i:i+75]))
          PY
